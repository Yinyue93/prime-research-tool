name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run tests
      run: cargo test --verbose --workspace
    
    - name: Run doctests
      run: cargo test --doc --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run security audit
      run: cargo audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Generate code coverage
      run: cargo llvm-cov --workspace --lcov --output-path lcov.info
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: lcov.info
        # No CODECOV_TOKEN is configured; tokenless uploads can be rate-limited
        fail_ci_if_error: false

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run benchmarks
      run: |
        cd prime-tool
        cargo bench --bench primality_bench
        cargo bench --bench factorization_bench
    
    - name: Run comprehensive benchmarks
      run: |
        cd prime-tool-bench
        timeout 300 cargo run --release || echo "Benchmark completed or timed out"

  build:
    name: Build All Targets
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    
    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build workspace
      run: cargo build --workspace --verbose
    
    - name: Build release
      run: cargo build --workspace --release --verbose

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build CLI tool
      run: cargo build --release --bin prime-tool
    
    - name: Test CLI functionality
      run: |
        set -euo pipefail
        BIN=./target/release/prime-tool
    
        # Test primality checking
        $BIN -f plain is-prime -n 999983 | grep "is PRIME"
        $BIN -f plain is-prime -n 1000000 | grep "is COMPOSITE"
        $BIN -f plain is-prime -n 18446744073709551557 | grep "is PRIME"
        $BIN -f plain is-prime -n 170141183460469231731687303715884105727 | grep "PROBABLE PRIME"
    
        # Test factorization
        $BIN -f plain factor -n 1234567 | grep "127 × 9721"
        $BIN -f plain factor -n 132543035165161565106540654065014651303 | grep "31 × 26641 × 160488787189720386242573784604393"
    
        # Test sieving
        $BIN -f json -o primes.json sieve -r 1..1000
        test -s primes.json
    
        # Test gap analysis
        $BIN gaps -r 1..1000 --twins
    
        # Test plotting
        $BIN plot -r 1..1000 -p prime-count -o test_plots
        test -s test_plots/prime_count.svg
    
    - name: Test web service
      run: |
        # Build and start web service in background
        cargo build --release --bin prime-tool-web
        ./target/release/prime-tool-web &
        WEB_PID=$!
    
        # Wait for service to start
        curl -f --retry 30 --retry-connrefused --retry-delay 1 http://localhost:3000/health
    
        # Test API endpoints
        curl -f http://localhost:3000/prime/999983
        curl -f "http://localhost:3000/sieve?start=1&end=100"
    
        # Clean up
        kill $WEB_PID

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write  # deploy step pushes to the gh-pages branch
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Generate documentation
      run: cargo doc --workspace --no-deps --document-private-items
    
    - name: Deploy documentation
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, fmt, clippy, build]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build release binaries
      run: |
        cargo build --release --bin prime-tool
        cargo build --release --bin prime-tool-web
        cargo build --release --bin prime-tool-bench
    
    - name: Create release archive
      run: |
        mkdir -p release
        cp target/release/prime-tool release/
        cp target/release/prime-tool-web release/
        cp target/release/prime-tool-bench release/
        cp README.md release/
        cp LICENSE* release/ || true
        tar -czf prime-research-tool-${{ github.ref_name }}.tar.gz -C release .
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: prime-research-tool-${{ github.ref_name }}.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance_regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install system dependencies
      # plotters needs fontconfig (via yeslogic-fontconfig-sys), absent on the runner image
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run performance comparison
      run: |
        # Run benchmarks on current branch
        cd prime-tool
        cargo bench --bench primality_bench -- --save-baseline current
    
        # Switch to main branch and run benchmarks
        git checkout main
        cargo bench --bench primality_bench -- --save-baseline main
    
        # Compare results
        cargo bench --bench primality_bench -- --load-baseline main --baseline current